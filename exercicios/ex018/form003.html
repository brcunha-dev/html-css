<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro.py" method="post" autocomplete="on">

        <p>
            <label for="icor">Cor: 
                <input type="color" name="cor" id="icor" value="#ff00ffc3">
            </label>
        </p>

        <p>
            <label for="inivel">Nivel de satisfação: 
                <input type="range" name="nivel" id="inivel" min="1" max="100" value="1">
            </label>
        </p>

        <p>
            <label for="ifoto"> Foto: 
                <input type="file" name="foto" id="ifoto">
            </label>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
