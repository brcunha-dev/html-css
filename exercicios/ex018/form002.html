<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.py" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <label for="imasc"><input type="radio" name="sexo" id="imasc">Masculino</label>

            <label for="ifem"><input type="radio" name="sexo" id="ifem">Feminino</label>

        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <label for="ivolei"><input type="checkbox" name="volei" id="ivolei">Volei</label> <br>

            <label for="ibasq"><input type="checkbox" name="basq" id="ibasq"> Basquete</label> <br>

            <label for="ifutam"><input type="checkbox" name="futam" id="ifutam"> Fotball</label>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="submit" value="Limpar">
        </p>
    </form>
</body>
</html>
