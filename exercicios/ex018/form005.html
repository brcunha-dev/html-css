<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.py" method="post" autocomplete="on">
        <p>
            <label for="in1">Número 1:</label>
            <input type="number" name="n1" id="in1" oninput="isoma.innerHTML = Number(in1.value)+Number(in2.value)">
        </p>
        <p>
            <label for="in2">Número 2:</label>
            <input type="number" name="n2" id="in2" oninput="isoma.innerHTML = Number(in1.value)+Number(in2.value)">
        </p>    
        <p>
            <label for="isoma">Soma:</label>
            <output id="isoma">0</output>
        </p>
        <p>
            <label for="irange"></label>
            <input type="range" name="range" id="irange" min="0" max="10" value="5" oninput="ival.innerHTML=Number(irange.value)">
            <output id="ival">5</output>
        </p>

        <p>
            <label for="iano">Ano que nasceu:</label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" oninput="calcIdade()">
        </p>

        <p>
            <label for="iidade">SUa idade é:</label>
            <output id="iidade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        

    </form>
    <script>
        function calcIdade(){
            let atual = new Date().getFullYear()
            iidade.innerHTML=Number(atual)-Number(iano.value)            
        }
            
    </script>
</body>
</html>
